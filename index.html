.was{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule)}
.tblScroll{overflow-x:auto}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--chip);color:var(--soft);margin:0 4px 4px 0}
.lead{margin:0;font-size:13.5px;line-height:1.85}

.hint{margin:11px 0 0;font-size:12.5px;color:var(--soft);line-height:1.7}

\"margin:0 0 4px 0;font-size:14px;color:#6B6C70;\">親愛的家長，這是<\/p>\n    <h1 style=\"margin:0 0 18px 0;font-size:21px;line-height:1.5;font-weight:700;color:#2D2E32;\">{{學生姓名}} 的麥塊程式班試聽課<\/h1>\n    <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" bgcolor=\"#FAFAFA\" style=\"background-color:#FAFAFA;border-radius:6px;\">\n      <tr><td bgcolor=\"#FAFAFA\" style=\"background-color:#FAFAFA;padding:18px 22px;\">\n        <p style=\"margin:0 0 5px 0;font-size:20px;font-weight:700;color:#2D2E32;line-height:1.5;\">{{日期}}（{{星期}}）{{開始時間}} – {{結束時間}}<\/p>\n        <p style=\"margin:0 0 4px 0;font-size:14px;color:#2D2E32;line-height:1.7;\">上課教室：<a href=\"{{教室地圖連結}}\" style=\"color:#00695C;font-weight:700;text-decoration:underline;\">{{教室名稱}}｜{{教室地址}}<\/a><\/p>\n        <p style=\"margin:0 0 4px 0;font-size:14px;color:#6B6C70;line-height:1.7;\">共 {{時長}} 分鐘・實體課程・請攜帶電腦、滑鼠、充電器與耳機來上課<\/p>\n        <p style=\"margin:0;font-size:14px;color:#2D2E32;line-height:1.7;\">課程結束後有 <strong>15–20 分鐘的家長說明會<\/strong>，請一併預留時間。<\/p>\n      <\/td><\/tr>\n    <\/table>\n  <\/td><\/tr>\n\n    <tr><td style=\"padding:20px 32px 6px 32px;\">\n    <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" bgcolor=\"#FFF6E5\" style=\"background-color:#FFF6E5;border-left:4px solid #FFA300;border-radius:8px;\">\n      <tr><td bgcolor=\"#FFF6E5\" style=\"background-color:#FFF6E5;padding:18px 20px;\">\n        <p style=\"margin:0 0 8px 0;font-size:16px;font-weight:700;color:#2D2E32;line-height:1.6;\">📅 這封信附了行事曆邀請<\/p>\n        <p style=\"margin:0 0 8px 0;font-size:14px;color:#2D2E32;line-height:1.8;\">按邀請卡上的「<strong>是<\/strong>」或「<strong>接受<\/strong>」，這堂課就會進到你的行事曆，時間先卡住，不用自己輸入。<\/p>\n        <p style=\"margin:0 0 8px 0;font-size:14px;color:#2D2E32;line-height:1.8;\">加進去之後，我們會提醒你兩次：<strong>前一天<\/strong>、<strong>課前 1 小時<\/strong>。<\/p>\n        <p style=\"margin:0;font-size:13px;color:#6B6C70;line-height:1.8;\">沒看到邀請卡？信裡附了一個行事曆檔，點開一樣可以加入。 <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const nav = document.getElementById('nav'), stage = document.getElementById('stage');
let cur = 'overview', width = 640;

function chip(t, brand){ const s=document.createElement('span'); s.className='ch'+(brand?' b':''); s.textContent=t; return s; }

function buildNav(){
  const mk = (id, label, chips) => {
    const b = document.createElement('button');
    b.className='row'; b.type='button'; b.dataset.id=id;
    const n=document.createElement('span'); n.className='rowname'; n.textContent=label; b.appendChild(n);
    (chips||[]).forEach(c=>b.appendChild(chip(c[0],c[1])));
    b.addEventListener('click',()=>{cur=id;render();});
    return b;
  };
  nav.appendChild(mk('overview','總覽：改了什麼'));
  [[true,'一般版・38 間教室'],[false,'無 LINE 版・'+D.noline.join('／')]].forEach(([hl,title])=>{
    const h=document.createElement('p'); h.className='grp'; h.textContent=title; nav.appendChild(h);
    D.letters.filter(l=>l.hasLine===hl).forEach(l=>{
      const c=[]; if(l.spec) c.push(['規格表',true]); if(!l.meeting) c.push(['無說明會',false]);
      nav.appendChild(mk(l.id, l.name, c));
    });
  });
}

function facts(pairs){
  const dl=document.createElement('dl'); dl.className='facts';
  pairs.forEach(([k,v])=>{
    const dt=document.createElement('dt'); dt.textContent=k;
    const dd=document.createElement('dd'); if(v instanceof Node) dd.appendChild(v); else dd.textContent=v;
    dl.append(dt,dd);
  });
  return dl;
}
function card(title, body){
  const s=document.createElement('section'); s.className='card';
  if(title){ const h=document.createElement('h2'); h.textContent=title; s.appendChild(h); }
  s.appendChild(body); return s;
}
function padded(){ const d=document.createElement('div'); d.className='pad'; return d; }

function renderOverview(){
  const a=padded();
  const p1=document.createElement('p'); p1.className='lead';
  p1.textContent='這十六封是實體試聽的行前通知信，拿線上版母版依實體主管給的 12 條更動說明改成。線上專屬的東西（軟體安裝、螢幕分享、學習平台帳密、iPad）整段拿掉，換成實體才有的教室地址、到場時間與攜帶物品。';
  const p2=document.createElement('p'); p2.className='lead';
  p2.textContent='每門課各有兩版：38 間教室用一般版；北投教室與新莊魔力沒有 LINE，用無 LINE 版，整封信不含任何 LINE 入口，改期、求助、署名四處文案都改成電話。';
  a.append(p1,p2);

  const t=document.createElement('div'); t.className='tblScroll';
  t.innerHTML='<table><thead><tr><th>#</th><th>項目</th><th>改前 → 改後</th><th>位置</th></tr></thead><tbody>'+
    D.changes.map(([n,item,was,now,where])=>
      `<tr><td class="num">${n}</td><td>${item}</td>`+
      `<td><span class="was">${was}</span><br>${now}</td><td class="meta">${where}</td></tr>`).join('')+
    '</tbody></table>';

  const e=padded();
  const eh=document.createElement('p'); eh.className='lead'; eh.innerHTML='<strong>'+D.extra[0]+'</strong>';
  const eb=document.createElement('p'); eb.className='hint'; eb.textContent=D.extra[1];
  e.append(eh,eb);

  const g=padded(); g.appendChild(facts(
    Object.entries(D.groups).map(([k,v])=>[k.startsWith('（')?'無 LINE':k, v.join('・')+`（${v.length}）`])
  ));

  const pd=document.createElement('div'); pd.className='pad stack';
  D.pending.forEach(([k,v])=>{
    const w=document.createElement('div');
    const h=document.createElement('p'); h.className='lead'; h.innerHTML='<strong>'+k+'</strong>';
    const b=document.createElement('p'); b.className='hint'; b.textContent=v;
    w.append(h,b); pd.appendChild(w);
  });

  stage.append(
    card('這批信是什麼', a),
    card('12 條更動逐條對照', t),
    card('行銷部另加的一項', e),
    card('40 間教室各用哪一個 LINE', g),
    card('還沒定案的三件事', pd)
  );
}

function renderLetter(l){
  stage.appendChild(card('這封信的設定', (()=>{
    const p=padded();
    const f=document.createElement('code'); f.textContent=l.file;
    p.appendChild(facts([
      ['課程全名', l.full],
      ['課程代號', (()=>{const c=document.createElement('code');c.textContent=l.key;return c;})()],
      ['課後說明會', l.meeting?'有，信裡請家長預留 15–20 分鐘':'無，改為顧問課後聯繫'],
      ['電腦規格需求表', l.spec?'附上（麥塊教育版與 Roblox 需要）':'不附（一般文書筆電即可）'],
      ['適用教室', l.hasLine?'38 間有 LINE 的教室':'北投教室、新莊魔力'],
      ['交付檔名', f],
    ]));
    return p;
  })()));

  const sec=document.createElement('section'); sec.className='card'; sec.style.overflow='hidden';
  const bar=document.createElement('div'); bar.className='bar';
  const seg=document.createElement('div'); seg.className='seg'; seg.setAttribute('role','group');
  seg.setAttribute('aria-label','檢視寬度');
  [[640,'桌機 640'],[375,'手機 375']].forEach(([w,label])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', String(width===w));
    b.addEventListener('click',()=>{width=w;render();});
    seg.appendChild(b);
  });
  const by=document.createElement('span'); by.className='meta'; by.id='fBytes';
  by.textContent=l.bytes.toLocaleString()+' bytes・Gmail 裁切門檻的 '+Math.round(l.bytes/102400*100)+'%';
  bar.append(seg,by);

  const wrap=document.createElement('div'); wrap.className='frameWrap';
  const fr=document.createElement('iframe'); fr.title=l.name+' 信件預覽';
  fr.style.width=width+'px'; fr.srcdoc=l.html;
  fr.addEventListener('load',()=>{
    try{ const h=fr.contentDocument.body.scrollHeight; if(h>200) fr.style.height=(h+24)+'px'; }
    catch(e){ /* 讀不到就維持預設高度，內容仍可在 iframe 內捲動 */ }
  });
  wrap.appendChild(fr);
  sec.append(bar,wrap);
  stage.appendChild(sec);
}

function render(){
  stage.textContent='';
  nav.querySelectorAll('button.row').forEach(b=>b.setAttribute('aria-current', String(b.dataset.id===cur)));
  if(cur==='overview') renderOverview();
  else renderLetter(D.letters.find(l=>l.id===cur));
  window.scrollTo({top:0});
}
buildNav(); render();
</script>

</body>
